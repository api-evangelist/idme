aid: idme
name: ID.me
description: >-
  ID.me is a digital identity network that provides NIST 800-63-3 IAL2/AAL2
  identity verification, single sign-on, and group affiliation (community)
  verification for government agencies, healthcare, and commercial partners.
  For developers, ID.me exposes an OpenID Connect and OAuth 2.0 identity
  provider (authorization code flow with PKCE, plus SAML 2.0 federation), a
  REST Services API for telecom and document verification, an Applications API,
  a Document Passback API, and a Shared Signals Framework (SSF) event stream for
  fraud and verification signals. Native iOS and Android SDKs, a button widget,
  conversion tracking, and multi-language sample code round out the developer
  surface, letting relying parties add strong identity proofing and attribute
  exchange to any application or IAM platform (Okta, Keycloak, Entra, PingOne,
  AWS Cognito).
