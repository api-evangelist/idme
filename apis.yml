apis:
- name: ID.me OpenID Connect & OAuth 2.0 API
  description: >-
    ID.me's OpenID Connect and OAuth 2.0 identity provider. Supports the
    authorization code flow (with PKCE), refresh tokens, encrypted ID tokens and
    userinfo, and returns verified identity attributes and community/group
    affiliation (military, responder, student, teacher, government, employee,
    etc.) after a user completes identity verification.
  humanURL: https://docs.id.me/guides/oidc/overview
