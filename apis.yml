- name: ID.me Services API
  description: >-
    ID.me's REST Services API for orchestrating identity verification: create
    and manage verifications, verify phone possession and identity via telecom
    endpoints, and verify identity documents (driver's licenses, passports,
    passport cards). Delivers real-time transaction results via webhooks and a
    sandbox of pre-configured test personas.
  humanURL: https://docs.id.me/services-api-overview
  baseURL: https://services.idmelabs.com
